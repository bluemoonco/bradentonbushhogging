<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" width="640" height="440"
     role="img" aria-label="Orange Kubota tractor pulling a rotary bush hog cutter, cutting a line through an overgrown Florida lot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Kubota tractor bush hogging an overgrown lot in Bradenton, Florida</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#E9F0E4"/>
      <stop offset="100%" stop-color="#D6E2CE"/>
    </linearGradient>
    <linearGradient id="cutground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#B9C293"/>
      <stop offset="100%" stop-color="#9CA87A"/>
    </linearGradient>
    <clipPath id="frame"><rect width="640" height="440" rx="12"/></clipPath>

    <!-- tall uncut scrub -->
    <pattern id="scrub" width="26" height="120" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#3D6B41" stroke-width="3" stroke-linecap="round">
        <path d="M4 120C4 84 1 68 7 44"/>
        <path d="M13 120c0-30 5-48 1-70"/>
        <path d="M22 120c0-26-4-44 3-62"/>
      </g>
      <g fill="none" stroke="#4E8B3C" stroke-width="2.4" stroke-linecap="round" opacity=".8">
        <path d="M8 120c0-24 6-40 2-56"/>
        <path d="M18 120c0-20-3-36 2-50"/>
      </g>
    </pattern>

    <!-- cut stubble -->
    <pattern id="stubble" width="22" height="40" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#7F8C5C" stroke-width="2.6" stroke-linecap="round">
        <path d="M4 40v-9"/><path d="M12 40v-6"/><path d="M19 40v-11"/>
      </g>
    </pattern>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="640" height="440" fill="url(#sky)"/>

    <!-- distant treeline: oak hammock + cabbage palms -->
    <g fill="#22492C" opacity=".5">
      <path d="M0 302c30-34 60-24 84-44 26-22 58-16 78 8 18 22 48 14 66 36z"/>
      <path d="M330 302c34-30 56-18 80-38 26-22 62-11 82 13 14 18 52 9 82 25z"/>
    </g>
    <g fill="#22492C" opacity=".55">
      <path d="M148 302V236h5v66z"/>
      <path d="M150 240c-18-10-30-5-34 6 14-9 24-6 34 4zM150 240c18-10 30-5 34 6-14-9-24-6-34 4zM150 238c-6-19 0-30 11-35-9 11-9 22-11 35zM150 238c8-17 18-22 29-19-13 3-21 9-29 19z"/>
      <path d="M566 302v-58h5v58z"/>
      <path d="M568 248c-16-9-26-4-30 5 12-8 21-5 30 3zM568 248c16-9 26-4 30 5-12-8-21-5-30 3zM568 246c-5-16 0-26 10-30-8 9-8 19-10 30z"/>
    </g>

    <!-- ground: cut on the left where the machine has already passed,
         standing scrub on the right where it hasn't -->
    <path d="M0 300 L500 300 L484 440 L0 440 Z" fill="url(#cutground)"/>
    <rect x="0" y="300" width="500" height="140" fill="url(#stubble)" opacity=".85"/>
    <path d="M500 300 L640 300 L640 440 L484 440 Z" fill="#3F5E33"/>
    <rect x="486" y="186" width="154" height="124" fill="url(#scrub)"/>

    <!-- the cut line: fresh edge right off the end of the deck -->
    <path d="M500 300 L484 440" stroke="#F26B21" stroke-width="3" stroke-dasharray="14 10" opacity=".9"/>

    <!-- chaff kicked up behind the cutter -->
    <g fill="#C6CFA6" opacity=".45">
      <ellipse cx="522" cy="322" rx="46" ry="21"/>
      <ellipse cx="556" cy="304" rx="30" ry="15"/>
      <ellipse cx="496" cy="300" rx="22" ry="12"/>
    </g>

    <!-- ======================= MACHINE ======================= -->
    <g>
      <!-- shadow -->
      <ellipse cx="316" cy="392" rx="196" ry="17" fill="#1B3F28" opacity=".22"/>

      <!-- rotary cutter deck -->
      <g>
        <rect x="352" y="316" width="132" height="30" rx="6" fill="#1E2A1C"/>
        <rect x="358" y="300" width="122" height="22" rx="7" fill="#D2540F"/>
        <rect x="358" y="300" width="122" height="7" rx="3.5" fill="#F26B21"/>
        <path d="M344 322h16" stroke="#2B3A28" stroke-width="9" stroke-linecap="round"/>
        <!-- tail wheel -->
        <circle cx="486" cy="352" r="15" fill="#20281E"/>
        <circle cx="486" cy="352" r="6" fill="#5C6553"/>
        <path d="M478 326l8 14" stroke="#2B3A28" stroke-width="7" stroke-linecap="round"/>
        <!-- chain guard -->
        <g stroke="#1E2A1C" stroke-width="3" opacity=".85">
          <path d="M360 346v10"/><path d="M374 346v10"/><path d="M388 346v10"/>
          <path d="M402 346v10"/><path d="M416 346v10"/><path d="M430 346v10"/>
          <path d="M444 346v10"/><path d="M458 346v10"/><path d="M472 346v10"/>
        </g>
      </g>

      <!-- chassis + body (Kubota orange) -->
      <path d="M158 302h188v34H158z" fill="#20281E"/>
      <path d="M164 262c0-9 7-16 16-16h72v58H164z" fill="#F26B21"/>
      <path d="M164 262c0-9 7-16 16-16h72v10H164z" fill="#FF8038"/>
      <rect x="252" y="256" width="26" height="64" fill="#D2540F"/>
      <!-- grille -->
      <g stroke="#20281E" stroke-width="3" stroke-linecap="round">
        <path d="M168 262h16"/><path d="M166 272h20"/><path d="M166 282h20"/><path d="M168 292h16"/>
      </g>
      <!-- headlight -->
      <circle cx="196" cy="264" r="7" fill="#FFE9A8" stroke="#20281E" stroke-width="2"/>

      <!-- exhaust stack -->
      <rect x="258" y="196" width="11" height="62" rx="3" fill="#31392C"/>
      <rect x="255" y="192" width="17" height="8" rx="3" fill="#20281E"/>

      <!-- ROPS canopy -->
      <g fill="#20281E">
        <rect x="292" y="182" width="10" height="120" rx="3"/>
        <rect x="348" y="182" width="10" height="96" rx="3"/>
        <rect x="278" y="170" width="94" height="12" rx="4"/>
      </g>

      <!-- seat + operator -->
      <path d="M300 272h30v10h-30z" fill="#2B3A28"/>
      <path d="M320 246h12v30h-12z" rx="4" fill="#2B3A28"/>
      <g>
        <circle cx="309" cy="222" r="13" fill="#3E4A38"/>
        <path d="M296 234c0-8 6-13 13-13s13 5 13 13v34h-26z" fill="#5D6B52"/>
        <path d="M296 240l-16 16" stroke="#5D6B52" stroke-width="9" stroke-linecap="round"/>
      </g>
      <!-- steering wheel -->
      <g stroke="#20281E" stroke-width="4" fill="none">
        <path d="M270 254l14-16"/><path d="M262 236h16"/>
      </g>

      <!-- rear fender -->
      <path d="M282 302a56 56 0 0 1 62-40v40z" fill="#D2540F"/>

      <!-- rear wheel -->
      <circle cx="318" cy="336" r="60" fill="#20281E"/>
      <circle cx="318" cy="336" r="60" fill="none" stroke="#151B13" stroke-width="10"/>
      <circle cx="318" cy="336" r="27" fill="#E5DFCE"/>
      <circle cx="318" cy="336" r="9" fill="#8C9382"/>
      <g stroke="#151B13" stroke-width="7" stroke-linecap="round" opacity=".9">
        <path d="M318 280l14 10"/><path d="M360 302l-16 8"/><path d="M370 350l-18-3"/>
        <path d="M344 386l-10-16"/><path d="M296 390l6-18"/><path d="M268 356l18-4"/>
        <path d="M276 302l16 10"/>
      </g>

      <!-- front wheel -->
      <circle cx="180" cy="352" r="38" fill="#20281E"/>
      <circle cx="180" cy="352" r="38" fill="none" stroke="#151B13" stroke-width="7"/>
      <circle cx="180" cy="352" r="15" fill="#E5DFCE"/>
      <circle cx="180" cy="352" r="5" fill="#8C9382"/>
    </g>
  </g>
</svg>
